<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>01 登录 注册 V2</title>
<link rel="stylesheet" href="base.css">
<style>
  body{background:#fff}
  .login{display:flex;width:1440px;height:900px}
  .brand{width:50%;background:var(--primary);color:#fff;padding:56px 64px;display:flex;flex-direction:column}
  .brand .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .brand .logo .mark{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
  .brand .mid{margin-top:180px}
  .brand h1{font-size:40px;line-height:1.28;margin:0 0 22px;font-weight:700;letter-spacing:.5px}
  .brand .sub{color:#CFE0D6;font-size:15px;margin:0 0 34px;max-width:520px}
  .brand .tags{display:flex;flex-wrap:wrap;gap:12px}
  .brand .tags span{border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:7px 16px;font-size:13px;color:#E4EFE8}
  .brand .foot{margin-top:auto;color:#B9D2C4;font-size:13px}
  .form-side{width:50%;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
  .form-card{width:392px}
  .form-card h1{font-size:30px;margin:0 0 10px;font-weight:700}
  .form-card .sub{color:var(--text2);font-size:13px;margin:0 0 30px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;color:var(--text2);margin-bottom:8px}
  .field input{width:100%;height:46px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:0 14px;font-size:14px;font-family:inherit;color:var(--text);outline:none}
  .field input::placeholder{color:var(--text3)}
  .agree{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text2);margin:6px 0 20px}
  .agree .box{width:16px;height:16px;border-radius:4px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
  .agree a{color:var(--primary);font-weight:600}
  .form-side{position:relative}
  .admin-entry{position:absolute;bottom:56px;left:0;width:100%;text-align:center;color:var(--text2);font-size:13px}
  .roles{display:flex;border-bottom:1px solid var(--border);margin-bottom:26px}
  .role{flex:1;text-align:center;padding:10px 0;font-size:14px;color:var(--text2);position:relative}
  .role.on{color:var(--primary);font-weight:600}
  .role.on:after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:var(--primary);border-radius:2px}
</style></head>
<body>
<div class="page">
  <div class="login">
    <div class="brand">
      <div class="logo"><span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 4c0 8-4 13-12 14 0-8 4-13 12-14z" fill="#fff"/><path d="M4 20c2-6 5-9 10-11" stroke="#1F4E3B" stroke-width="1.8" stroke-linecap="round"/></svg></span>材神食验室</div>
      <div class="mid">
        <h1>告诉我冰箱里有什么，<br>今晚吃什么我来想。</h1>
        <p class="sub">登录后可保存口味偏好、忌口与过敏源，收藏菜谱、同步购物清单。</p>
        <div class="tags">
          <span>上传图片识食材</span><span>忌口自动过滤</span><span>分步烹饪教学</span><span>多商家比价买菜</span>
        </div>
      </div>
      <div class="foot">让每一份食材都不被辜负</div>
    </div>

    <div class="form-side">
      <div class="form-card">
        <h1>欢迎回来</h1>
        <p class="sub">没有账号？试试<span style="color:var(--primary);font-weight:600">注册</span>吧。</p>
        <div class="roles"><div class="role on">登录</div><div class="role">注册</div></div>
        <div class="field">
          <label>账号</label>
          <input type="text" placeholder="请输入账号 / 手机号">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" placeholder="请输入密码">
        </div>
        <div class="agree"><span class="box">✓</span>我已阅读并同意 <a>《用户协议》</a> 和 <a>《隐私政策》</a></div>
        <button class="btn btn-primary btn-block" style="height:46px">登录 / 注册</button>
      </div>
      <div class="admin-entry">管理员请从<span style="color:var(--primary);font-weight:600">后台入口</span>登录</div>
    </div>
  </div>
</body></html>
